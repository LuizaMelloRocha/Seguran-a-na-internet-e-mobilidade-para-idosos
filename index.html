<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conectividade Segura - Guia Digital para a Terceira Idade</title>

    <style>
        :root {
            --lilas-principal: #6d3fa9;
            --lilas-escuro: #4b2375;
            --lilas-claro: #eee4fa;
            --lilas-detalhe: #c9a9ed;

            --fundo: #ffffff;
            --fundo-secundario: #f7f3fb;
            --texto: #252525;
            --texto-secundario: #4a4a4a;

            --borda: #d9c8eb;
            --sombra: rgba(70, 35, 100, 0.15);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 18px;
            line-height: 1.7;
            background-color: var(--fundo);
            color: var(--texto);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        img {
            max-width: 100%;
            display: block;
        }

        a {
            color: var(--lilas-escuro);
        }

        a:focus,
        button:focus {
            outline: 4px solid #ffbf47;
            outline-offset: 3px;
        }

        /* MODO ESCURO */

        body.dark-mode {
            --fundo: #17131c;
            --fundo-secundario: #241d2d;
            --texto: #f7f2fc;
            --texto-secundario: #e3d9eb;

            --lilas-principal: #a875df;
            --lilas-escuro: #c79aef;
            --lilas-claro: #342843;

            --borda: #684c7d;
            --sombra: rgba(0, 0, 0, 0.5);
        }

        /* ALTO CONTRASTE */

        body.high-contrast {
            --fundo: #000000;
            --fundo-secundario: #000000;
            --texto: #ffffff;
            --texto-secundario: #ffffff;

            --lilas-principal: #ffff00;
            --lilas-escuro: #ffff00;
            --lilas-claro: #000000;

            --borda: #ffffff;
            --sombra: none;
        }

        body.high-contrast header,
        body.high-contrast nav,
        body.high-contrast footer {
            background: #000000;
            border-color: #ffffff;
        }

        body.high-contrast .card,
        body.high-contrast .solucao,
        body.high-contrast .accessibility-panel {
            border: 2px solid white;
        }

        /* CABEÇALHO */

        header {
            background: linear-gradient(
                135deg,
                var(--lilas-principal),
                var(--lilas-escuro)
            );

            color: white;
            padding: 35px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            line-height: 1.2;
        }

        header p {
            margin: 12px auto 0;
            max-width: 800px;
            font-size: 1.15rem;
        }

        /* ACESSIBILIDADE */

        .accessibility-panel {
            background: var(--fundo-secundario);
            padding: 15px 20px;
            border-bottom: 1px solid var(--borda);
            text-align: center;
        }

        .accessibility-panel strong {
            display: block;
            margin-bottom: 10px;
            color: var(--lilas-escuro);
        }

        .accessibility-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .accessibility-buttons button {
            background: var(--fundo);
            color: var(--texto);
            border: 2px solid var(--lilas-principal);
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .accessibility-buttons button:hover {
            background: var(--lilas-claro);
        }

        /* MENU */

        nav {
            background-color: var(--lilas-escuro);
        }

        .menu-list {
            list-style: none;
            margin: 0;
            padding: 0;

            display: flex;
            justify-content: center;
            align-items: stretch;
            flex-wrap: wrap;
        }

        .menu-list li a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 22px;
            font-weight: bold;
            font-size: 1.05rem;
            border-bottom: 4px solid transparent;
        }

        .menu-list li a:hover {
            background-color: var(--lilas-principal);
            border-bottom-color: #ffffff;
        }

        .menu-toggle {
            display: none;
            width: 100%;
            background-color: var(--lilas-escuro);
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 1.2rem;
            text-align: left;
            cursor: pointer;
        }

        /* CONTEÚDO */

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: var(--fundo);
            margin-bottom: 35px;
            padding: 30px;
            border-radius: 14px;
            border: 1px solid var(--borda);
            box-shadow: 0 4px 15px var(--sombra);
        }

        .card h2 {
            margin-top: 0;
            color: var(--lilas-principal);
            font-size: 2rem;
        }

        .card h3 {
            color: var(--lilas-escuro);
            font-size: 1.35rem;
        }

        .card p {
            color: var(--texto);
        }

        .card ul {
            padding-left: 30px;
        }

        .card li {
            margin-bottom: 12px;
        }

        /* AVISOS */

        .aviso {
            background: var(--lilas-claro);
            border-left: 6px solid var(--lilas-principal);
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }

        .aviso strong {
            color: var(--lilas-escuro);
        }

        /* CARDS */

        .solucoes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .solucao {
            background: var(--fundo-secundario);
            padding: 22px;
            border-radius: 12px;
            border-left: 6px solid var(--lilas-principal);
        }

        .solucao h3 {
            margin-top: 0;
            color: var(--lilas-principal);
        }

        /* BOTÃO DE LEITURA */

        .leitura {
            margin-top: 20px;
            background: var(--lilas-principal);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .leitura:hover {
            background: var(--lilas-escuro);
        }

        /* RODAPÉ */

        footer {
            background-color: var(--lilas-escuro);
            color: white;
            text-align: center;
            padding: 35px 20px;
            margin-top: 50px;
        }

        footer h2 {
            margin-top: 0;
            font-size: 1.5rem;
        }

        footer p {
            margin: 7px 0;
        }

        footer a {
            color: white;
            font-weight: bold;
        }

        /* RESPONSIVIDADE */

        @media (max-width: 768px) {

            body {
                font-size: 17px;
            }

            header h1 {
                font-size: 2rem;
            }

            .menu-toggle {
                display: block;
            }

            .menu-list {
                display: none;
                flex-direction: column;
            }

            .menu-list.active {
                display: flex;
            }

            .menu-list li a {
                border-top: 1px solid var(--lilas-detalhe);
                padding: 15px 20px;
            }

            .card {
                padding: 22px;
            }

            .card h2 {
                font-size: 1.7rem;
            }

            .accessibility-buttons {
                flex-direction: column;
            }

            .accessibility-buttons button {
                width: 100%;
                max-width: 350px;
            }
        }
    </style>
</head>

<body>

    <header id="inicio">

        <h1>Conectividade Segura</h1>

        <p>
            Orientação, acessibilidade e segurança no mundo digital
            para pessoas idosas.
        </p>

    </header>


    <!-- ACESSIBILIDADE -->

    <section
        class="accessibility-panel"
        aria-label="Ferramentas de acessibilidade">

        <strong>
            ♿ Recursos de acessibilidade
        </strong>

        <div class="accessibility-buttons">

            <button
                id="aumentarFonte"
                type="button">
                🔍 Aumentar fonte
            </button>

            <button
                id="diminuirFonte"
                type="button">
                🔎 Diminuir fonte
            </button>

            <button
                id="modoEscuro"
                type="button">
                🌙 Modo escuro
            </button>

            <button
                id="altoContraste"
                type="button">
                ⚫ Alto contraste
            </button>

            <button
                id="restaurar"
                type="button">
                ↺ Restaurar
            </button>

        </div>

    </section>

    <nav aria-label="Menu principal">

        <button
            class="menu-toggle"
            id="menuToggle"
            type="button"
            aria-expanded="false"
            aria-controls="menuList">

            ☰ Menu

        </button>
