<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conectividade Segura - Guia para a Terceira Idade</title>
    <style>
        /* Estilos base */
        body {
            font-family: Arial, sans-serif;
            font-size: 18px;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Modos de acessibilidade */
        body.dark-mode {
            background-color: #121212;
            color: #ffffff;
        }

        body.high-contrast {
            background-color: #000000;
            color: #ffff00;
        }

        /* Cartões e layout */
        .card {
            background: #ffffff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        body.dark-mode .card {
            background: #1e1e1e;
        }

        body.high-contrast .card {
            background: #000000;
            border: 2px solid #ffff00;
        }

        .aviso {
            background-color: #e8f4f8;
            border-left: 4px solid #007bff;
            padding: 10px 15px;
            margin: 15px 0;
        }

        body.dark-mode .aviso {
            background-color: #263238;
            border-left-color: #80bdff;
        }

        body.high-contrast .aviso {
            background-color: #000;
            border-left: 4px solid #ffff00;
        }

        /* Botões de acessibilidade */
        .acessibilidade-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 15px;
            font-size: 1rem;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #fff;
        }

        /* Estilo da navegação */
        .menu-list {
            display: none;
            list-style: none;
            padding: 0;
        }

        .menu-list.active {
            display: block;
        }

        .solucoes {
            display: grid;
            gap: 15px;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        }

        .solucao {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <!-- BARRA DE ACESSIBILIDADE -->
    <section class="acessibilidade-bar" aria-label="Controles de acessibilidade">
        <div>
            <button id="aumentarFonte" type="button">
